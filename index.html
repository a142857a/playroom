<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Play Felt Studio piano or Skyward Bloom plane shooter.">
  <title>Playroom — Piano &amp; Plane Shooter</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23252623'/%3E%3Cpath d='m25 17 23 15-23 15Z' fill='%23d7e7a2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="homepage.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1 class="brand"><span class="brand-icon" aria-hidden="true">▶</span> Playroom</h1>
    </header>

    <main aria-label="Choose a game">
      <div class="games">
        <a class="game-card piano-card" href="felt-piano/index.html" aria-labelledby="piano-title piano-action">
          <div class="art" aria-hidden="true">
            <img class="piano-illustration" src="assets/piano.svg" alt="" width="520" height="260">
          </div>
          <div class="card-copy">
            <h2 id="piano-title">Felt Studio</h2>
            <div class="card-bottom"><span id="piano-action">Play piano</span><span class="arrow" aria-hidden="true">↗</span></div>
          </div>
        </a>

        <a class="game-card shooter-card" href="neon-wake/index.html" aria-labelledby="shooter-title shooter-action">
          <div class="art" aria-hidden="true">
            <img src="assets/plane.svg" alt="" width="520" height="260">
          </div>
          <div class="card-copy">
            <h2 id="shooter-title">Skyward Bloom</h2>
            <div class="card-bottom"><span id="shooter-action">Take flight</span><span class="arrow" aria-hidden="true">↗</span></div>
          </div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
